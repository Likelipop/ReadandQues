[project]
name = "NewsPipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.20",
    "dagster-webserver",
    "dagster-postgres>=0.29.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pymongo>=4.6.0",
    "minio>=7.2.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.8.0",
    "chromadb>=1.5.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=2.0.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "langchain-experimental>=0.4.2",
    "en-core-web-sm",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "NewsPipeline"
registry_modules = [
    "NewsPipeline.components.*",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }


