name: CI Pipeline

on:
  push:
    branches: [main, develop, "feat/*", "fix/*", "refactor/*"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test-and-lint:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django ruff

      - name: Run Ruff Linter
        run: |
          ruff check ReadAndQues/ ai_service/

      - name: Run Pytest Test Suite
        env:
          DJANGO_SETTINGS_MODULE: ReadAndQues.settings.dev
          SECRET_KEY: ci-test-key-for-github-actions-readandques
        run: |
          pytest ReadAndQues/readspace/tests ReadAndQues/accounts/tests ReadAndQues/service/tests/test_ai_functional_suite.py ai_service/agents/tests

  frontend-test-and-build:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: npm run build
