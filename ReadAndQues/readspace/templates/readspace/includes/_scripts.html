<div id="csrf-wrapper" style="display: none;">
    {% csrf_token %}
</div>
<script>

    // Global CSRF helper - handles HttpOnly CSRF cookie by reading from the DOM
    function getCookie(name) {
        if (name === 'csrftoken') {
            const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
            if (csrfInput) return csrfInput.value;
        }
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // ── Render Markdown passage ──
    (function() {
        const rawEl = document.getElementById('raw-article-text');
        const targetEl = document.getElementById('article-rendered-text');
        if (rawEl && targetEl && typeof marked !== 'undefined') {
            const text = rawEl.textContent || '';
            if (text.trim()) {
                targetEl.innerHTML = marked.parse(text, { breaks: true, gfm: true });
            }
        }
    })();



    // ── Toolbox Logic (Marker & Eraser) ──
    let activeTool = null;
    const btnMarker = document.getElementById('tool-marker');
    const btnEraser = document.getElementById('tool-eraser');
    const articleSectionContent = document.getElementById('article-rendered-text');
    const articleIframe = document.getElementById('article-iframe');
    const toolbox = document.getElementById('toolbox');
    const dragHandle = document.getElementById('toolbox-drag-handle');

    if (toolbox && dragHandle) {
        let isDragging = false;
        let startY, startTop, startX, startLeft;

        function startDrag(clientX, clientY) {
            isDragging = true;
            startY = clientY;
            startX = clientX;
            
            // Remove transitions so drag is instantaneous and doesn't rubber-band
            toolbox.classList.remove('transition-all');
            
            const rect = toolbox.getBoundingClientRect();
            // Remove translate-y-1/2 class to use absolute positioning cleanly
            if (toolbox.classList.contains('-translate-y-1/2')) {
                toolbox.classList.remove('-translate-y-1/2', 'top-1/2');
                // Don't rely on classList.remove for complex tailwind arbitrary classes,
                // inline style will override them anyway.
                toolbox.style.top = rect.top + 'px';
                toolbox.style.left = rect.left + 'px';
            }
            
            const pTop = parseInt(toolbox.style.top, 10);
            const pLeft = parseInt(toolbox.style.left, 10);
            startTop = isNaN(pTop) ? rect.top : pTop;
            startLeft = isNaN(pLeft) ? rect.left : pLeft;
            
            document.body.style.userSelect = 'none';
            if (articleIframe) articleIframe.style.pointerEvents = 'none';
        }

        function moveDrag(clientX, clientY) {
            if (!isDragging) return;
            const deltaY = clientY - startY;
            const deltaX = clientX - startX;
            toolbox.style.top = (startTop + deltaY) + 'px';
            toolbox.style.left = (startLeft + deltaX) + 'px';
        }

        function stopDrag() {
            if (isDragging) {
                isDragging = false;
                document.body.style.userSelect = '';
                if (articleIframe) articleIframe.style.pointerEvents = '';
                // Optional: restore transition if you want snap effects later, but usually better left off after manual drag
                // toolbox.classList.add('transition-all');
            }
        }

        // Mouse Events
        dragHandle.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Only left click
            startDrag(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        document.addEventListener('mouseup', stopDrag);

        // Touch Events (Mobile/Tablet)
        dragHandle.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch) startDrag(touch.clientX, touch.clientY);
        }, { passive: false });
        
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            // Prevent scrolling page while dragging
            e.preventDefault(); 
            const touch = e.touches[0];
            if (touch) moveDrag(touch.clientX, touch.clientY);
        }, { passive: false });
        
        document.addEventListener('touchend', stopDrag);
    }
    
    let targetWindow = window;
    let targetDoc = document;
    let targetContainer = articleSectionContent;

    function setActiveTool(tool) {
        activeTool = (activeTool === tool) ? null : tool;
        
        if (btnMarker) {
            if (activeTool === 'marker') {
                btnMarker.classList.add('bg-yellow-100', 'text-yellow-600');
                btnMarker.classList.remove('bg-transparent', 'text-slate-600');
            } else {
                btnMarker.classList.remove('bg-yellow-100', 'text-yellow-600');
                btnMarker.classList.add('bg-transparent', 'text-slate-600');
            }
        }
        if (btnEraser) {
            if (activeTool === 'eraser') {
                btnEraser.classList.add('bg-pink-100', 'text-pink-600');
                btnEraser.classList.remove('bg-transparent', 'text-slate-600');
            } else {
                btnEraser.classList.remove('bg-pink-100', 'text-pink-600');
                btnEraser.classList.add('bg-transparent', 'text-slate-600');
            }
        }
        
        if (targetContainer) {
            if (activeTool === 'marker') {
                targetContainer.style.cursor = 'text';
            } else if (activeTool === 'eraser') {
                targetContainer.style.cursor = 'crosshair';
            } else {
                targetContainer.style.cursor = 'auto';
            }
        }
    }

    if (btnMarker && btnEraser) {
        btnMarker.addEventListener('click', () => setActiveTool('marker'));
        btnEraser.addEventListener('click', () => setActiveTool('eraser'));
    }

    function getArticleId() {
        return '{{ article.id|default:"" }}';
    }

    function saveHighlightsToStorage() {
        if (!targetContainer) return;
        try {
            const marks = targetContainer.querySelectorAll('mark.user-highlight');
            const snippets = Array.from(marks).map(m => (m.getAttribute('data-original-text') || m.textContent).trim()).filter(s => s.length > 2);
            localStorage.setItem(`article_highlights_${getArticleId()}`, JSON.stringify(snippets));
            triggerAutoSave();
        } catch(e) {
            console.error("Error saving highlights:", e);
        }
    }

    function restoreHighlightsFromStorage(tDoc, tContainer) {
        if (!tContainer || !tDoc) return;
        try {
            const raw = localStorage.getItem(`article_highlights_${getArticleId()}`);
            if (!raw) return;
            const snippets = JSON.parse(raw);
            if (!Array.isArray(snippets) || snippets.length === 0) return;

            snippets.forEach(textToFind => {
                if (!textToFind || textToFind.length < 3) return;
                const walker = tDoc.createTreeWalker(tContainer, NodeFilter.SHOW_TEXT, null, false);
                let node;
                const textNodes = [];
                while (node = walker.nextNode()) {
                    if (node.parentNode && node.parentNode.nodeName.toLowerCase() !== 'mark' && node.parentNode.nodeName.toLowerCase() !== 'script' && node.parentNode.nodeName.toLowerCase() !== 'style') {
                        textNodes.push(node);
                    }
                }
                for (let tNode of textNodes) {
                    const idx = tNode.nodeValue.indexOf(textToFind);
                    if (idx !== -1) {
                        const range = tDoc.createRange();
                        range.setStart(tNode, idx);
                        range.setEnd(tNode, idx + textToFind.length);
                        const mark = tDoc.createElement('mark');
                        mark.className = 'user-highlight';
                        mark.style.backgroundColor = '#fef08a';
                        mark.style.borderRadius = '0.25rem';
                        mark.style.padding = '0.125rem 0.25rem';
                        mark.style.cursor = 'pointer';
                        mark.setAttribute('data-original-text', textToFind);
                        try {
                            range.surroundContents(mark);
                        } catch(e) {}
                        break;
                    }
                }
            });
        } catch(e) {
            console.error("Error restoring highlights:", e);
        }
    }

    function setupHighlighter(tWindow, tDoc, tContainer) {
        restoreHighlightsFromStorage(tDoc, tContainer);

        tContainer.addEventListener('mouseup', () => {
            if (activeTool !== 'marker') return;
            const selection = tWindow.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            if (!tContainer.contains(range.commonAncestorContainer)) return;

            let node = range.startContainer;
            let isOverlapping = false;
            while (node && node !== tContainer) {
                if (node.nodeType === 1 && node.tagName.toLowerCase() === 'mark' && node.classList.contains('user-highlight')) {
                    isOverlapping = true; break;
                }
                node = node.parentNode;
            }
            
            node = range.endContainer;
            while (!isOverlapping && node && node !== tContainer) {
                if (node.nodeType === 1 && node.tagName.toLowerCase() === 'mark' && node.classList.contains('user-highlight')) {
                    isOverlapping = true; break;
                }
                node = node.parentNode;
            }
            
            if (!isOverlapping) {
                const fragment = range.cloneContents();
                if (fragment.querySelector && fragment.querySelector('mark.user-highlight')) {
                    isOverlapping = true;
                }
            }
            
            if (isOverlapping) {
                selection.removeAllRanges();
                return;
            }

            const content = range.extractContents();
            const mark = tDoc.createElement('mark');
            mark.className = 'user-highlight';
            mark.style.backgroundColor = '#fef08a';
            mark.style.borderRadius = '0.25rem';
            mark.style.padding = '0.125rem 0.25rem';
            mark.style.cursor = 'pointer';
            mark.appendChild(content);
            mark.setAttribute('data-original-text', mark.textContent);
            range.insertNode(mark);
            selection.removeAllRanges();
            saveHighlightsToStorage();
        });

        tContainer.addEventListener('click', async (e) => {
            let target = e.target;
            
            if (target.tagName.toLowerCase() !== 'mark' && target.closest('mark.user-highlight')) {
                target = target.closest('mark.user-highlight');
            }

            if (target.tagName.toLowerCase() === 'mark' && target.classList.contains('user-highlight')) {
                if (activeTool === 'eraser') {
                    if (target.classList.contains('is-paraphrased')) {
                        target.innerHTML = target.getAttribute('data-original-text');
                        target.classList.remove('is-paraphrased');
                        target.style.backgroundColor = '#fef08a';
                        target.style.opacity = '1';
                        saveHighlightsToStorage();
                    } else {
                        const parent = target.parentNode;
                        while (target.firstChild) {
                            parent.insertBefore(target.firstChild, target);
                        }
                        parent.removeChild(target);
                        parent.normalize();
                        saveHighlightsToStorage();
                    }
                } else {
                    if (target.classList.contains('is-loading') || target.classList.contains('is-paraphrased')) return;

                    const highlightedText = target.getAttribute('data-original-text') || target.textContent;
                    
                    if (!target.hasAttribute('data-original-text')) {
                        target.setAttribute('data-original-text', highlightedText);
                    }
                    
                    let pContextNode = target.closest('p, div, li');
                    if (!pContextNode) pContextNode = target.parentNode;
                    const paragraphText = pContextNode.textContent;
                    
                    let walker = tDoc.createTreeWalker(pContextNode, NodeFilter.SHOW_TEXT, null, false);
                    let node;
                    let startIdx = 0;
                    while (node = walker.nextNode()) {
                        if (node.parentNode === target || node.parentNode.closest('mark.user-highlight') === target) {
                            break;
                        }
                        startIdx += node.nodeValue.length;
                    }
                    const endIdx = startIdx + highlightedText.length;

                    const originalColor = target.style.backgroundColor;
                    target.classList.add('is-loading');
                    target.style.backgroundColor = '#e2e8f0'; 
                    target.style.transition = 'all 0.5s ease-in-out';
                    target.innerHTML = `<span class="inline-block animate-spin mr-1">⌛</span>${highlightedText}`;

                    try {
                        const res = await fetch(`/readspace/api/${getArticleId()}/smart_paraphrase/`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': getCookie('csrftoken')
                            },
                            body: JSON.stringify({
                                highlighted_text: highlightedText,
                                paragraph_text: paragraphText,
                                start_index: startIdx,
                                end_index: endIdx
                            })
                        });
                        
                        const data = await res.json();
                        if (data.status === 'success') {
                            target.innerHTML = data.expanded_text;
                            target.style.backgroundColor = '#bfdbfe'; 
                            
                            setTimeout(() => {
                                target.style.opacity = '0';
                                setTimeout(() => {
                                    target.innerHTML = `<strong>${data.paraphrased_text}</strong>`;
                                    target.style.backgroundColor = '#dcfce7'; 
                                    target.style.opacity = '1';
                                    
                                    target.classList.remove('is-loading');
                                    target.classList.add('is-paraphrased');
                                    saveHighlightsToStorage();
                                }, 300);
                            }, 1000); 
                        } else {
                            target.innerHTML = highlightedText;
                            target.style.backgroundColor = originalColor;
                            target.classList.remove('is-loading');
                            alert("Failed to paraphrase: " + data.message);
                        }
                    } catch (err) {
                        console.error(err);
                        target.innerHTML = highlightedText;
                        target.style.backgroundColor = originalColor;
                        target.classList.remove('is-loading');
                    }
                }
            }
        });
    }

    if (articleIframe) {
        articleIframe.addEventListener('load', function() {
            try {
                targetWindow = articleIframe.contentWindow;
                targetDoc = articleIframe.contentWindow.document;
                targetContainer = targetDoc.body;
                setupHighlighter(targetWindow, targetDoc, targetContainer);
            } catch(e) {
                console.error("Cannot inject highlighter into iframe:", e);
            }
        });
    } else if (articleSectionContent) {
        setupHighlighter(window, document, articleSectionContent);
    }

    function getHighlightedMarkdown() {
        if (!targetContainer) return "";
        const clone = targetContainer.cloneNode(true);
        const marks = clone.querySelectorAll('mark.user-highlight');
        marks.forEach(m => {
            const text = m.textContent;
            const textNode = document.createTextNode(`==${text}==`);
            m.parentNode.replaceChild(textNode, m);
        });
        return clone.innerText;
    }

    // Auto-save logic
    let saveTimeout = null;
    function triggerAutoSave() {
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveMarkersToDB, 2000); // Debounce 2 seconds
    }

    function saveMarkersToDB() {
        const highlightedMarkdown = getHighlightedMarkdown();
        if (!highlightedMarkdown.includes('==')) return; // No highlights to save

        
        
        fetch(`/readspace/api/${getArticleId()}/save_markers/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                highlighted_markdown: highlightedMarkdown
            })
        }).then(r => r.json()).then(data => {
            console.log("Markers auto-saved", data);
        }).catch(e => console.error("Auto-save failed", e));
    }
    // ── AI Quiz Toggle & Split View Logic ──
    const btnAiQuiz = document.getElementById('tool-ai-quiz');
    const leftCol = document.getElementById('left-column');
    const rightCol = document.getElementById('right-column');
    const centerCol = document.getElementById('center-column');
    const quizPanel = document.getElementById('quiz-panel');
    const readingContainer = document.getElementById('reading-container');
    const timerDisplay = document.getElementById('quiz-timer-display');
    
    let isQuizActive = false;

    if (btnAiQuiz) {
        btnAiQuiz.addEventListener('click', () => {
            isQuizActive = !isQuizActive;
            
            if (isQuizActive) {
                // Activate Split View
                btnAiQuiz.classList.add('bg-indigo-100', 'text-indigo-600');
                btnAiQuiz.classList.remove('bg-transparent', 'text-slate-600');
                
                leftCol.classList.add('hidden');
                leftCol.classList.remove('lg:block');
                rightCol.classList.add('hidden');
                rightCol.classList.remove('lg:block');
                
                centerCol.classList.remove('lg:w-3/5');
                centerCol.classList.add('lg:w-3/5'); // Actually we keep it 60%
                
                readingContainer.classList.remove('max-w-4xl');
                readingContainer.classList.add('max-w-none'); // Expand within its 60% column
                
                quizPanel.classList.remove('hidden');
                quizPanel.classList.add('flex');
                
                if (timerDisplay) timerDisplay.classList.remove('hidden');

                // Clear any previous reload lock when user explicitly triggers quiz
                sessionStorage.removeItem(`quiz_reloaded_${getArticleId()}`);

                const hasQuiz = {{ article.has_quiz|yesno:"true,false" }};
                const quizStatus = '{{ article.quiz_status|default:"none" }}';

                if (!hasQuiz) {
                    if (quizStatus !== 'processing' && quizStatus !== 'pending') {
                        fetch(`/readspace/trigger-quiz/${getArticleId()}/`, {
                            method: 'POST',
                            headers: {
                                'X-CSRFToken': getCookie('csrftoken')
                            }
                        })
                        .then(res => {
                            if (!res.ok) throw new Error("Trigger failed");
                            localStorage.removeItem(`readspace_exam_state_${getArticleId()}`);
                            startQuizPolling();
                        })
                        .catch(err => {
                            console.warn("AI Quiz generation currently unavailable:", err);
                        });
                    } else {
                        // Generation already in progress, poll for completion
                        startQuizPolling();
                    }
                }

            } else {
                // Deactivate Split View
                btnAiQuiz.classList.remove('bg-indigo-100', 'text-indigo-600');
                btnAiQuiz.classList.add('bg-transparent', 'text-slate-600');
                
                leftCol.classList.remove('hidden');
                leftCol.classList.add('lg:block');
                rightCol.classList.remove('hidden');
                rightCol.classList.add('lg:block');
                
                readingContainer.classList.remove('max-w-none');
                readingContainer.classList.add('max-w-4xl');
                
                quizPanel.classList.add('hidden');
                quizPanel.classList.remove('flex');
                
                if (timerDisplay) timerDisplay.classList.add('hidden');
            }
        });
    }

    // ── Render FIB paragraphs: replace [1]...[5] with inline <input> blanks ──
    function initFIBParagraphs() {
        document.querySelectorAll('.fib-paragraph').forEach((container, pIdx) => {
            const raw = container.getAttribute('data-raw-question');
            if (!raw || container.querySelector('.fib-blank')) return;
            const parts = raw.split(/(?:\[|\()\s*(\d+)\s*(?:\]|\))/);
            container.innerHTML = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    container.appendChild(document.createTextNode(parts[i]));
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'fib-blank px-2 py-1 border-b-2 border-blue-500 bg-blue-50 text-blue-800 font-semibold focus:outline-none focus:border-blue-700 mx-1 rounded-sm text-center w-24';
                    input.placeholder = parts[i];
                    input.setAttribute('data-blank-index', parts[i]);
                    input.setAttribute('data-cache-id', `fib_${pIdx}_${parts[i]}`);
                    container.appendChild(input);
                }
            }
        });
    }
    initFIBParagraphs();

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function renderQuizzesDynamically(exams) {
        if (!exams || !exams.length || !exams[0].quizzes) return;
        const quizzes = exams[0].quizzes;
        const container = document.getElementById('quiz-container');
        if (!container) return;

        let html = `
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>
                AI Quiz
            </h2>
            <div id="quiz-timer-display" class="font-mono text-lg font-semibold bg-slate-100 px-3 py-1 rounded-md text-slate-700 shadow-sm border border-slate-200">00:00</div>
        </div>
        <div id="quiz-items-wrapper">`;

        quizzes.forEach((quiz, index) => {
            const qNum = index + 1;
            html += `<div class="quiz-item bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6" data-answer="${escapeHtml(quiz.correct_answer)}" data-quiz-type="${escapeHtml(quiz.quiz_type)}">`;
            
            if (quiz.quiz_type === 'yes_no_notgiven' || quiz.quiz_type === 'multiple_choice') {
                const subtitle = quiz.quiz_type === 'yes_no_notgiven' ? 'Yes / No / Not Given' : '';
                html += `
                    <p class="font-semibold text-lg mb-1 text-gray-800">
                        <span class="mr-2 text-blue-600">${qNum}.</span>${escapeHtml(quiz.question)}
                    </p>
                    ${subtitle ? `<p class="text-xs text-gray-400 mb-4 italic">${subtitle}</p>` : ''}
                    <div class="space-y-3 options-container">`;
                (quiz.options || []).forEach(opt => {
                    html += `
                        <label class="flex items-center p-3 border rounded cursor-pointer hover:bg-gray-50 transition-colors option-label">
                            <input type="radio" name="question_${qNum}" value="${escapeHtml(opt)}" class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500 mr-3">
                            <span class="text-gray-700">${escapeHtml(opt)}</span>
                        </label>`;
                });
                html += `</div>`;
            } else if (quiz.quiz_type === 'fill_in_blank') {
                html += `
                    <p class="font-semibold text-lg mb-1 text-gray-800">
                        <span class="mr-2 text-blue-600">${qNum}.</span>Summary Completion
                    </p>
                    <p class="text-xs text-gray-400 mb-4 italic">Fill each blank with a word or short phrase from the passage.</p>
                    <div class="fib-paragraph text-gray-700 leading-loose options-container" data-raw-question="${escapeHtml(quiz.question)}">
                    </div>`;
            }

            html += `
                <div class="explanation hidden mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 text-sm text-gray-700 rounded-r">
                    <strong class="text-blue-800">Correct Answer:</strong> ${escapeHtml(quiz.correct_answer)} <br>
                    <strong class="text-blue-800 mt-2 block">Explanation:</strong> ${escapeHtml(quiz.explanation)}
                </div>
            </div>`;
        });

        html += `
            <button id="submit-btn" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg shadow-md">
                Submit Exam
            </button>
        </div>`;

        container.innerHTML = html;
        initFIBParagraphs();
        if (typeof initExamHandlers === 'function') {
            initExamHandlers();
        }
    }

    // ── Quiz Generation Polling Logic (Dynamic SPA update, ZERO Page Reloads) ──
    let quizPollTimeout = null;
    let quizPollDone = false;

    function startQuizPolling() {
        if (quizPollTimeout || quizPollDone) return;
        
        function poll() {
            fetch(`/readspace/status/${getArticleId()}/?t=${Date.now()}`)
                .then(r => r.json())
                .then(data => {
                    if (data.has_quiz === true && data.exams && data.exams.length > 0) {
                        // Quiz ready — dynamically render quizzes into DOM (NO PAGE RELOAD)
                        quizPollDone = true;
                        quizPollTimeout = null;
                        renderQuizzesDynamically(data.exams);
                    } else if (data.quiz_status === 'failed') {
                        quizPollDone = true;
                        quizPollTimeout = null;
                        const proc = document.getElementById('processing-right');
                        if (proc) {
                            proc.innerHTML = `
                                <div class="h-12 w-12 mx-auto rounded-full bg-red-100 flex items-center justify-center mb-4">
                                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </div>
                                <p class="text-red-600 font-semibold">Failed to generate quizzes. Please try again later.</p>
                                <p class="text-sm text-gray-500 mt-2">You can still read the text on the left.</p>`;
                        }
                    } else {
                        quizPollTimeout = setTimeout(poll, 3000);
                    }
                })
                .catch(() => {
                    quizPollTimeout = setTimeout(poll, 4000);
                });
        }
        poll();
    }

    // Auto-start quiz polling on page load if generation is in progress
    (function checkQuizGenerationStatus() {
        const hasQuiz = {{ article.has_quiz|yesno:"true,false" }};
        const quizStatus = '{{ article.quiz_status|default:"none" }}';
        if (!hasQuiz && (quizStatus === 'pending' || quizStatus === 'processing')) {
            startQuizPolling();
        }
    })();

    // ── Quiz State & Timer & Submit ──
    function initExamHandlers() {
        const storageKey = `readspace_exam_state_${getArticleId()}`;
        
        let examState = { elapsedTime: 0, answers: {}, submitted: false };
        try {
            const stored = localStorage.getItem(storageKey);
            if (stored) examState = JSON.parse(stored);
        } catch(e) {}

        function saveState() {
            localStorage.setItem(storageKey, JSON.stringify(examState));
        }

        // Timer
        const timerDisplay = document.getElementById('quiz-timer-display');
        if (timerDisplay && !window.examTimerInterval) {
            function updateTimer() {
                if (!examState.submitted && typeof isQuizActive !== 'undefined' && isQuizActive) {
                    examState.elapsedTime++;
                    saveState();
                }
                const minutes = Math.floor(examState.elapsedTime / 60);
                const seconds = examState.elapsedTime % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            updateTimer();
            window.examTimerInterval = setInterval(updateTimer, 1000);
        }

        // Restore Answers
        document.querySelectorAll('.fib-blank').forEach(input => {
            const cacheId = input.getAttribute('data-cache-id');
            if (examState.answers[cacheId]) {
                input.value = examState.answers[cacheId];
            }
            input.oninput = (e) => {
                examState.answers[cacheId] = e.target.value;
                saveState();
            };
        });

        document.querySelectorAll('input[type="radio"]').forEach(input => {
            const cacheId = input.name;
            if (examState.answers[cacheId] === input.value) {
                input.checked = true;
            }
            input.onchange = (e) => {
                if (e.target.checked) {
                    examState.answers[cacheId] = e.target.value;
                    saveState();
                }
            };
        });
        
        // Evaluate Visually
        function evaluateVisually() {
            const items = document.querySelectorAll('.quiz-item');
            let correctCount = 0;
            items.forEach(item => {
                const correctAnswer = item.getAttribute('data-answer').trim().toLowerCase();
                const quizType = item.getAttribute('data-quiz-type');

                if (quizType === 'fill_in_blank') {
                    const answers = correctAnswer.split('|').map(a => a.trim());
                    const blanks = item.querySelectorAll('.fib-blank');
                    let allCorrect = true;
                    blanks.forEach((blank, idx) => {
                        const userVal = blank.value.trim().toLowerCase();
                        const expected = answers[idx] || '';
                        if (userVal === expected) {
                            blank.classList.add('border-green-500', 'bg-green-100', 'text-green-800');
                            blank.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-800');
                        } else {
                            blank.classList.add('border-red-500', 'bg-red-100', 'text-red-800');
                            blank.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-800');
                            allCorrect = false;
                        }
                        blank.disabled = true;
                    });
                    if (allCorrect) {
                        correctCount++;
                        item.classList.add('border-green-500', 'bg-green-50');
                    } else {
                        item.classList.add('border-red-500', 'bg-red-50');
                    }
                    item.classList.remove('border-gray-200');
                } else {
                    const inputs = item.querySelectorAll('input[type="radio"]');
                    let userAnswer = null;
                    const selected = Array.from(inputs).find(r => r.checked);
                    if (selected) userAnswer = selected.value.trim().toLowerCase();

                    if (userAnswer === correctAnswer) {
                        correctCount++;
                        item.classList.add('border-green-500', 'bg-green-50');
                    } else {
                        item.classList.add('border-red-500', 'bg-red-50');
                    }
                    item.classList.remove('border-gray-200');
                    inputs.forEach(input => input.disabled = true);
                }

                const expl = item.querySelector('.explanation');
                if (expl) expl.classList.remove('hidden');
            });
            
            return { correctCount, totalQuestions: items.length };
        }
        
        // Render Related
        function renderRelated(related_articles) {
            if (related_articles && related_articles.length > 0) {
                const bm25Section = document.getElementById('bm25-related-section');
                const bm25Grid = document.getElementById('bm25-grid');
                if (bm25Section && bm25Grid) {
                    bm25Grid.innerHTML = '';
                    related_articles.forEach(r_art => {
                        const a = document.createElement('a');
                        a.href = `/readspace/${r_art.id}/`;
                        a.className = 'group bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition duration-200';
                        
                        const imgUrl = r_art.image_url ? r_art.image_url : 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=400';
                        const opacityClass = r_art.image_url ? 'opacity-100' : 'opacity-10';
                        
                        a.innerHTML = `
                            <div class="h-24 w-full relative overflow-hidden flex items-center justify-center">
                                <div class="absolute inset-0 ${opacityClass} bg-cover bg-center" style="background-image: url('${imgUrl}');"></div>
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/40 to-transparent"></div>
                                <span class="absolute bottom-2 right-2 text-white text-[10px] font-bold bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded-full">
                                    ${r_art.source_name || "Related"}
                                </span>
                            </div>
                            <div class="p-3">
                                <h4 class="font-bold text-slate-800 line-clamp-2 text-sm group-hover:text-blue-600 transition min-h-[2.5rem]">
                                    ${r_art.title || "No title"}
                                </h4>
                            </div>
                        `;
                        bm25Grid.appendChild(a);
                    });
                    bm25Section.classList.remove('hidden');
                }
            }
        }
        
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) {
            if (examState.submitted) {
                evaluateVisually();
                const chromaSection = document.getElementById('related-articles-section');
                if (chromaSection) chromaSection.classList.remove('hidden');
                renderRelated(examState.related_articles);
                submitBtn.disabled = true;
                submitBtn.textContent = 'Exam Submitted';
                submitBtn.className = 'w-full mt-6 bg-gray-400 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-md cursor-not-allowed';
            }

            submitBtn.onclick = function() {
                if (examState.submitted) return;

                let allAnswered = true;
                const items = document.querySelectorAll('.quiz-item');
                items.forEach(item => {
                    const qType = item.getAttribute('data-quiz-type');
                    if (qType === 'fill_in_blank') {
                        const blanks = item.querySelectorAll('.fib-blank');
                        blanks.forEach(b => { if (!b.value.trim()) allAnswered = false; });
                    } else {
                        const inputs = item.querySelectorAll('input[type="radio"]');
                        const answered = Array.from(inputs).some(r => r.checked);
                        if (!answered) allAnswered = false;
                    }
                });

                if (!allAnswered) {
                    if (!confirm("You haven't filled in all the answers. Are you sure you want to submit?")) return;
                }

                const { correctCount, totalQuestions } = evaluateVisually();

                const highlightedMarkdown = typeof getHighlightedMarkdown === 'function' ? getHighlightedMarkdown() : '';
                const elapsedTime = examState.elapsedTime;
                
                fetch(`/readspace/${getArticleId()}/submit/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        score: correctCount,
                        total_questions: totalQuestions,
                        answers: examState.answers,
                        time_taken_seconds: elapsedTime,
                        highlighted_markdown: highlightedMarkdown
                    })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        examState.submitted = true;
                        examState.related_articles = data.related_articles || [];
                        saveState();
                        
                        evaluateVisually();
                        const chromaSection = document.getElementById('related-articles-section');
                        if (chromaSection) chromaSection.classList.remove('hidden');
                        renderRelated(data.related_articles);
                        
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Exam Submitted';
                        submitBtn.className = 'w-full mt-6 bg-gray-400 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-md cursor-not-allowed';
                    } else {
                        alert("Failed to submit exam: " + (data.message || 'Error'));
                    }
                })
                .catch(err => {
                    console.error("Submit error:", err);
                    alert("An error occurred while submitting.");
                });
            };
        }
    }

    {% if article.exams and article.exams.0.quizzes %}
        initExamHandlers();
    {% endif %}

    /* --- AI Question Tickets Frontend Controller --- */
    const ARTICLE_ID = "{{ article.id|default:'' }}";

    function getArticleTicketsKey() {
        return `ai_tickets_${ARTICLE_ID || 'global'}`;
    }

    function loadSavedArticleTickets() {
        try {
            const raw = localStorage.getItem(getArticleTicketsKey());
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            console.error("Failed to load tickets from localStorage:", e);
            return [];
        }
    }

    function saveArticleTickets(tickets) {
        try {
            localStorage.setItem(getArticleTicketsKey(), JSON.stringify(tickets));
            updateTicketCountBadge(tickets.length);
        } catch (e) {
            console.error("Failed to save tickets to localStorage:", e);
        }
    }

    function updateTicketCountBadge(count) {
        const badge = document.getElementById("ticket-count-badge");
        if (badge) {
            badge.textContent = `${count} Ticket${count !== 1 ? 's' : ''}`;
        }
    }

    function clearArticleTickets() {
        if (confirm("Are you sure you want to clear all AI Question Tickets for this article?")) {
            localStorage.removeItem(getArticleTicketsKey());
            renderTicketsFeed([]);
        }
    }

    function usePresetTicket(presetText) {
        const input = document.getElementById("ticket-question-input");
        if (input) {
            input.value = presetText;
            input.focus();
        }
    }

    function toggleTicketsPanel() {
        const rightCol = document.getElementById("right-column");
        if (rightCol) {
            rightCol.classList.toggle("hidden");
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatTicketAnswer(text) {
        if (!text) return "";
        
        // 1. Primary: Use marked.js if loaded
        if (typeof marked !== 'undefined' && marked.parse) {
            try {
                return marked.parse(text, { breaks: true, gfm: true });
            } catch (e) {
                console.error("Error parsing marked.js:", e);
            }
        }

        // 2. Secondary: Robust Built-in Parser (bold **, italic *, list -)
        let escaped = escapeHtml(text);
        escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
        
        const lines = escaped.split('\n');
        let inList = false;
        let result = '';
        
        lines.forEach(line => {
            const trimmed = line.trim();
            if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                if (!inList) {
                    result += '<ul class="list-disc pl-4 my-1 space-y-1">';
                    inList = true;
                }
                result += `<li>${trimmed.substring(2)}</li>`;
            } else {
                if (inList) {
                    result += '</ul>';
                    inList = false;
                }
                if (trimmed) {
                    result += `<p class="mb-1">${line}</p>`;
                }
            }
        });
        if (inList) {
            result += '</ul>';
        }
        return result;
    }

    function renderTicketsFeed(tickets) {
        const feed = document.getElementById("tickets-feed");
        const emptyState = document.getElementById("tickets-empty-state");
        if (!feed) return;

        if (!tickets || tickets.length === 0) {
            feed.innerHTML = `
                <div id="tickets-empty-state" class="flex flex-col items-center justify-center py-10 text-center px-4">
                    <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center text-2xl mb-3 shadow-inner">
                        📩
                    </div>
                    <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">No Tickets Yet</h4>
                    <p class="text-xs text-slate-500 max-w-xs leading-relaxed">
                        Submit a question ticket above. AI will analyze the article excerpts and attach direct quotes as evidence.
                    </p>
                </div>
            `;
            updateTicketCountBadge(0);
            return;
        }

        updateTicketCountBadge(tickets.length);
        let html = "";

        tickets.forEach(ticket => {
            const isResolved = ticket.status === "RESOLVED";
            const isProcessing = ticket.status === "PROCESSING";
            const statusBadgeClass = isResolved
                ? "bg-emerald-100 text-emerald-700 border-emerald-300"
                : isProcessing
                ? "bg-amber-100 text-amber-700 border-amber-300 animate-pulse"
                : "bg-rose-100 text-rose-700 border-rose-300";
            
            const statusText = isResolved ? "[RESOLVED]" : isProcessing ? "[PROCESSING...]" : "[NOT FOUND]";

            html += `
                <div class="ticket-card bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden transition-all duration-200 hover:shadow-md">
                    <!-- User Question Ticket Header -->
                    <div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-start gap-2">
                        <div class="flex items-center gap-2">
                            <span class="text-base">👤</span>
                            <div>
                                <span class="font-mono text-[10px] text-slate-400 font-semibold">${ticket.ticket_id || 'TKT-00000'}</span>
                                <p class="text-xs font-bold text-slate-800 leading-snug">${escapeHtml(ticket.question)}</p>
                            </div>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${statusBadgeClass} shrink-0">
                            ${statusText}
                        </span>
                    </div>

                    <!-- AI Response Body -->
                    <div class="p-3 text-xs text-slate-700 space-y-2">
            `;

            if (isProcessing) {
                html += `
                        <div class="flex items-center gap-2 text-amber-600 py-2">
                            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span class="font-medium text-xs">AI analyzing article excerpts...</span>
                        </div>
                `;
            } else {
                html += `
                        <div class="flex items-start gap-2">
                            <span class="text-sm shrink-0 mt-0.5">🤖</span>
                            <div class="ticket-answer-body leading-relaxed font-normal text-slate-800 text-xs w-full overflow-hidden space-y-1">${formatTicketAnswer(ticket.answer)}</div>
                        </div>
                `;

                if (ticket.citation_quote) {
                    html += `
                        <div class="mt-2.5 p-2.5 bg-indigo-50/60 border-l-4 border-indigo-500 rounded-r-lg">
                            <div class="text-[10px] font-bold text-indigo-700 uppercase tracking-wider mb-1 flex items-center gap-1">
                                💬 Evidence Citation
                            </div>
                            <blockquote class="text-[11px] italic text-indigo-900 leading-snug font-serif">
                                "${escapeHtml(ticket.citation_quote)}"
                            </blockquote>
                        </div>
                    `;
                }
            }

            html += `
                        <div class="mt-2 pt-2 border-t border-slate-100 flex justify-between items-center text-[10px] text-slate-400">
                            <span>ReadAndQues Grounded AI</span>
                            <span>${ticket.timestamp || ''}</span>
                        </div>
                    </div>
                </div>
            `;
        });

        feed.innerHTML = html;
        feed.scrollTop = 0;
    }

    async function submitQuestionTicket(event) {
        event.preventDefault();
        const input = document.getElementById("ticket-question-input");
        const submitBtn = document.getElementById("submit-ticket-btn");
        const btnText = document.getElementById("btn-text");
        const btnSpinner = document.getElementById("btn-spinner");

        if (!input || !input.value.trim()) return;

        const question = input.value.trim();
        input.value = "";

        // Extract article text from DOM
        const articleContainer = document.getElementById("reading-container") || document.body;
        const articleText = articleContainer.innerText || articleContainer.textContent || "";

        // Create temporary pending ticket
        const pendingTicket = {
            ticket_id: `TKT-${Math.floor(10000 + Math.random() * 90000)}`,
            question: question,
            answer: "",
            citation_quote: "",
            status: "PROCESSING",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        };

        const existingTickets = loadSavedArticleTickets();
        const updatedTickets = [pendingTicket, ...existingTickets];
        saveArticleTickets(updatedTickets);
        renderTicketsFeed(updatedTickets);

        // UI Loading state
        if (submitBtn) submitBtn.disabled = true;
        if (btnText) btnText.classList.add("hidden");
        if (btnSpinner) btnSpinner.classList.remove("hidden");

        try {
            const response = await fetch("/readspace/api/ai/tool/run/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken') || '',
                },
                body: JSON.stringify({
                    tool_name: "ask_article",
                    version: "1.0.0",
                    input_data: {
                        article_text: articleText,
                        question: question
                    }
                })
            });

            const data = await response.json();
            
            let finalTicket;
            if (data.status === "completed" && data.output) {
                finalTicket = {
                    ticket_id: data.output.ticket_id || pendingTicket.ticket_id,
                    question: question,
                    answer: data.output.answer || "Answer processed.",
                    citation_quote: data.output.citation_quote || "",
                    status: data.output.status || "RESOLVED",
                    timestamp: data.output.timestamp || pendingTicket.timestamp,
                };
            } else {
                finalTicket = {
                    ticket_id: pendingTicket.ticket_id,
                    question: question,
                    answer: data.error || "Failed to process ticket.",
                    citation_quote: "",
                    status: "ERROR",
                    timestamp: pendingTicket.timestamp,
                };
            }

            // Replace pending ticket with final result
            const currentTickets = loadSavedArticleTickets();
            const idx = currentTickets.findIndex(t => t.ticket_id === pendingTicket.ticket_id);
            if (idx !== -1) {
                currentTickets[idx] = finalTicket;
            } else {
                currentTickets.unshift(finalTicket);
            }
            saveArticleTickets(currentTickets);
            renderTicketsFeed(currentTickets);

        } catch (err) {
            console.error("Error submitting ticket:", err);
            const currentTickets = loadSavedArticleTickets();
            const idx = currentTickets.findIndex(t => t.ticket_id === pendingTicket.ticket_id);
            const errTicket = {
                ticket_id: pendingTicket.ticket_id,
                question: question,
                answer: "Network error submitting ticket.",
                citation_quote: "",
                status: "ERROR",
                timestamp: pendingTicket.timestamp,
            };
            if (idx !== -1) currentTickets[idx] = errTicket;
            saveArticleTickets(currentTickets);
            renderTicketsFeed(currentTickets);
        } finally {
            if (submitBtn) submitBtn.disabled = false;
            if (btnText) btnText.classList.remove("hidden");
            if (btnSpinner) btnSpinner.classList.add("hidden");
        }
    }

    // Helper to read CSRF Cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Bind Ctrl+Enter shortcut and load initial tickets on page load
    document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("ticket-question-input");
        if (input) {
            input.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    e.preventDefault();
                    submitQuestionTicket(e);
                }
            });
        }

        const savedTickets = loadSavedArticleTickets();
        renderTicketsFeed(savedTickets);
    });
</script>
