<!-- Daily Vocab Section -->
<div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-lg border border-slate-100 relative overflow-hidden flex flex-col justify-center">
    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-100 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
    <div class="relative z-10 flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <svg class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            Word of the Day
        </h2>
    </div>
    
    <div class="relative z-10">
        <h3 class="text-4xl md:text-5xl font-black text-slate-900 mb-2 font-serif">{{ daily_vocab.word }}</h3>
        <span class="text-sm font-medium text-slate-500 italic mb-4 inline-block">{{ daily_vocab.type }}</span>
        
        <p class="text-slate-700 text-lg leading-relaxed mb-6">{{ daily_vocab.meaning }}</p>
        
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
            <p class="text-slate-600 italic font-serif">"{{ daily_vocab.example }}"</p>
        </div>
    </div>
</div>
