line-length = 120
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (e.g. Depends)
    "W191",  # indentation contains tabs
    "UP042", # Enum inheritance
    "E402",  # module level import not at top of file
    "B904",  # raise ... from err
    "F403",  # star imports in settings
    "F405",  # star import names
    "F401",  # unused imports in __init__
    "W291",  # trailing whitespace in prompts
    "W293",  # blank line whitespace
    "UP035", # typing.Dict deprecated
    "F841",  # unused local variable
]

[lint.isort]
known-first-party = ["ReadAndQues", "accounts", "homepage", "readspace", "service"]
